{% set name = "yacron" %}
{% set version = "0.12.0" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/{{ name }}-{{ version }}.tar.gz
  sha256: 45e38b2de4d6ef88498371dd83c2cab7d8f30c4058a6918a2e2ff8f949f5dc00

build:
  noarch: python
  number: 1
  script: {{ PYTHON }} -m pip install . -vv
  entry_points:
    - yacron = yacron.__main__:main

requirements:
  host:
    - python {{ python_min }}
    - pip
    - pytest-runner
    - setuptools_scm
  run:
    - python >={{ python_min }}
    - strictyaml >=0.7.2
    - crontab
    - aiohttp
    - sentry-sdk
    - aiosmtplib
    - jinja2
    - pytz

test:
  requires:
    - python {{ python_min }}
  imports:
    - yacron
  commands:
    - yacron --version

about:
  home: https://github.com/gjcarneiro/yacron
  license: MIT
  license_family: MIT
  license_file: LICENSE
  summary: A modern Cron replacement that is Docker-friendly
  dev_url: https://github.com/gjcarneiro/yacron

extra:
  recipe-maintainers:
    - mcs07
